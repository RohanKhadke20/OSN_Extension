name: CI Quality Assurance

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-pack:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Static Syntax Verification
        run: npm run check

      - name: Run Unit Test Suites
        run: npm test

      - name: Verify Zero-Dependency Packaging
        run: npm run pack

      - name: Verify Distribution Archive Artifact
        shell: bash
        run: |
          if [ ! -f dist/*.zip ]; then
            echo "Error: Extension distribution ZIP was not generated."
            exit 1
          fi
          echo "Distribution archive verified successfully."
