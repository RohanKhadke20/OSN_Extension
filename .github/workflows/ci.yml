name: CI Quality Assurance

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-pack:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Static Syntax Verification
        run: npm run check

      - name: Run Unit Test Suites (241 tests)
        run: npm test

      - name: Verify Performance Benchmarks
        run: npm run bench

      - name: Verify Zero-Dependency Multi-Browser Packaging
        run: npm run pack:all

      - name: Verify Distribution Archive Artifacts (Chrome, Firefox, Safari)
        shell: bash
        run: |
          for target in chrome firefox safari; do
            if ! ls dist/*${target}*.zip 1> /dev/null 2>&1 && ! ls dist/osn-guard-safety-privacy-shield-v*.zip 1> /dev/null 2>&1; then
              echo "Error: Extension distribution ZIP for $target was not generated."
              exit 1
            fi
          done
          echo "All multi-browser distribution archives verified successfully."

